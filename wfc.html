<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave function collapse — level generator</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      *:not(dialog) { margin: 0; }

      body {
        min-height: 100vh;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        background-color: #111111;
        color: #e8e8e8;
        font-family: ui-monospace, monospace;
        line-height: 1.5;
      }

      h1 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      label { color: #8a8a8a; }

      input, button {
        font: inherit;
        padding: 0.35rem 0.75rem;
        border: 1px solid #3a3a3a;
        border-radius: 0.25rem;
        background-color: #1c1c1c;
        color: inherit;
      }

      input { width: 8rem; }

      button { cursor: pointer; }
      button:hover { border-color: #6a6a6a; }

      canvas {
        display: block;
        width: 100%;
        max-width: 1536px;
        height: auto;
        image-rendering: pixelated;
        border: 1px solid #3a3a3a;
      }

      #status { color: #8a8a8a; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <h1>Wave function collapse — level generator</h1>

    <div class="controls">
      <label for="seed">seed</label>
      <input id="seed" type="number" value="1" step="1" />
      <button id="regenerate" type="button">Regenerate</button>
    </div>

    <canvas id="canvas"></canvas>

    <p id="status"></p>

    <script type="module" src="/src/demos/wfc/main.ts"></script>
  </body>
</html>
